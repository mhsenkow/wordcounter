<!doctype html>
<meta charset="utf-8">
<title>touch / mobile smoke</title>
<pre id="out">running…</pre>
<script>
(async () => {
  const out = document.getElementById('out');
  const tools = [
    'bill', 'hourly', 'fuel', 'unit', 'dose', 'bitrate', 'scalemap',
    'ratio', 'typescale', 'odds', 'combo', 'sample',
    'budget', 'exposure', 'deal', 'streak',
    'tax', 'pace', 'contrast', 'bayes'
  ];
  const results = [];

  function loadFrame(path, w, h) {
    return new Promise((resolve, reject) => {
      const iframe = document.createElement('iframe');
      iframe.style.cssText = 'position:fixed;left:-9999px;width:' + w + 'px;height:' + h + 'px;border:0';
      iframe.src = '/' + path + '/?smoke=' + Date.now();
      const t = setTimeout(() => reject(new Error('timeout ' + path)), 8000);
      iframe.onload = () => {
        clearTimeout(t);
        setTimeout(() => resolve(iframe), 140);
      };
      document.body.appendChild(iframe);
    });
  }

  function firePointer(el, type, opts) {
    const e = new PointerEvent(type, Object.assign({
      bubbles: true,
      cancelable: true,
      pointerId: 1,
      pointerType: 'touch',
      isPrimary: true,
      clientX: 120,
      clientY: 200,
      buttons: type === 'pointerup' ? 0 : 1
    }, opts));
    el.dispatchEvent(e);
    return e;
  }

  for (const path of tools) {
    const row = { tool: path, ok: true, notes: [] };
    let iframe;
    try {
      iframe = await loadFrame(path, 390, 844);
      const doc = iframe.contentDocument;
      const win = iframe.contentWindow;
      const soon = doc.body.classList.contains('is-soon');

      const inputs = doc.querySelectorAll('main input[type="number"], main input[type="text"], main select');
      inputs.forEach((el) => {
        const fs = parseFloat(win.getComputedStyle(el).fontSize);
        if (fs < 15.5) {
          row.ok = false;
          row.notes.push(el.id + ' font ' + fs + 'px (<16)');
        }
        if (el.tagName === 'INPUT' && el.getAttribute('enterkeyhint') !== 'done') {
          row.ok = false;
          row.notes.push(el.id + ' missing enterkeyhint');
        }
        if (el.getAttribute('autocomplete') !== 'off') {
          row.ok = false;
          row.notes.push(el.id + ' autocomplete');
        }
      });

      const rows = doc.querySelectorAll('label.row');
      rows.forEach((r) => {
        const h = r.getBoundingClientRect().height;
        if (h < 44) {
          row.ok = false;
          row.notes.push('row short ' + Math.round(h) + 'px');
        }
      });

      if (!soon) {
        if (doc.documentElement.getAttribute('data-gestures') !== '1') {
          row.ok = false;
          row.notes.push('gestures off');
        }
        const primary =
          doc.querySelector('main input[type="number"][data-primary]') ||
          doc.querySelector('main input[type="number"]');
        const face = doc.querySelector('.face');
        const stageEl = doc.getElementById('toolStage');

        if (primary && stageEl && path !== 'ratio') {
          const pe = win.getComputedStyle(stageEl).pointerEvents;
          if (pe === 'none') {
            row.ok = false;
            row.notes.push('stage pointer-events none');
          }
          const before = primary.value;
          const y0 = 120;
          firePointer(stageEl, 'pointerdown', { clientX: 160, clientY: y0 });
          for (let i = 1; i <= 6; i++) {
            firePointer(stageEl, 'pointermove', { clientX: 160, clientY: y0 - i * 30 });
          }
          firePointer(stageEl, 'pointerup', { clientX: 160, clientY: y0 - 180 });
          if (Number(primary.value) === Number(before)) {
            row.ok = false;
            row.notes.push('stage scrub no change');
          }
        }

        if (primary && face) {
          const before = primary.value;
          const y0 = 180;
          firePointer(face, 'pointerdown', { clientX: 160, clientY: y0 });
          for (let i = 1; i <= 6; i++) {
            firePointer(face, 'pointermove', { clientX: 160, clientY: y0 - i * 30 });
          }
          firePointer(face, 'pointerup', { clientX: 160, clientY: y0 - 180 });
          if (Number(primary.value) === Number(before)) {
            row.ok = false;
            row.notes.push('face scrub no change ' + before + '→' + primary.value);
          }
        }

        /* Every number row must scrub its own field when dragged on the input */
        const nums = Array.from(doc.querySelectorAll('main label.row input[type="number"]'));
        for (const input of nums) {
          const before = input.value;
          const y0 = 220;
          firePointer(input, 'pointerdown', { clientX: 280, clientY: y0 });
          for (let i = 1; i <= 6; i++) {
            firePointer(input, 'pointermove', { clientX: 280, clientY: y0 - i * 30 });
          }
          firePointer(input, 'pointerup', { clientX: 280, clientY: y0 - 180 });
          if (Number(input.value) === Number(before)) {
            row.ok = false;
            row.notes.push('row scrub ' + (input.id || '?') + ' no change');
          }
        }

        const spin = doc.querySelector('.spin-btn');
        if (spin) {
          const hit = spin.getBoundingClientRect();
          /* visual small, but ::after hit slop — check computed min via after not available; ensure spin exists */
          if (hit.width < 20 || hit.height < 16) {
            row.ok = false;
            row.notes.push('spin too small');
          }
        }

        if (path === 'ratio') {
          const stage = doc.querySelector('.ratio-stage');
          if (!stage) {
            row.ok = false;
            row.notes.push('ratio stage missing');
          }
        }

        /* Per-tool settings extras + scrub targets */
        const settingsBtn = doc.getElementById('settingsToggle');
        if (settingsBtn) {
          settingsBtn.click();
          const sheet = doc.getElementById('settings');
          const extras = sheet ? sheet.querySelectorAll('.fields fieldset .seg input[type="radio"]') : [];
          const lookNames = new Set(['theme', 'ui', 'font', 'faces', 'showViz']);
          const extraRadios = Array.from(extras).filter((el) => !lookNames.has(el.name));
          if (extraRadios.length < 2) {
            row.ok = false;
            row.notes.push('extra settings radios ' + extraRadios.length);
          } else {
            const name = extraRadios.find((el) => !el.checked) || extraRadios[1];
            const beforeKind = stageEl && stageEl.innerHTML.slice(0, 80);
            name.checked = true;
            name.dispatchEvent(new win.Event('change', { bubbles: true }));
            const afterKind = stageEl && stageEl.innerHTML.slice(0, 80);
            if (stageEl && beforeKind === afterKind && path !== 'ratio') {
              /* some settings only restyle; still require a settings key persisted */
              try {
                const raw = win.localStorage.getItem('ibm.tool.' + path + '.settings');
                if (!raw || !raw.includes(name.name)) {
                  row.ok = false;
                  row.notes.push('extra setting not persisted');
                }
              } catch (e) {
                row.notes.push('localStorage');
              }
            }
          }
          /* close settings */
          doc.body.classList.remove('settings-open');
          if (sheet) sheet.setAttribute('hidden', '');
        }

        const scrub = doc.querySelectorAll('#toolStage [data-scrub], .ratio-stage');
        if (path !== 'ratio' && scrub.length < 1) {
          row.ok = false;
          row.notes.push('no data-scrub on stage');
        }
      }

      const css = doc.querySelector('link[href*="number-tool.css"]');
      if (css && !/v=34/.test(css.getAttribute('href') || '')) {
        row.notes.push('css cache not v32');
      }
    } catch (err) {
      row.ok = false;
      row.notes.push(String(err.message || err));
    }
    if (iframe) iframe.remove();
    results.push(row);
  }

  /* Desk tools: words + time viewport + 16px fields */
  for (const desk of [
    { path: 'wordcount', alias: 'words', file: '/' },
    { path: 'timecount', alias: 'time', file: '/timecount/' }
  ]) {
    const row = { tool: desk.alias, ok: true, notes: [] };
    let iframe;
    try {
      iframe = await new Promise((resolve, reject) => {
        const el = document.createElement('iframe');
        el.style.cssText = 'position:fixed;left:-9999px;width:390px;height:844px;border:0';
        el.src = desk.file + '?smoke=' + Date.now();
        const t = setTimeout(() => reject(new Error('timeout')), 8000);
        el.onload = () => { clearTimeout(t); setTimeout(() => resolve(el), 140); };
        document.body.appendChild(el);
      });
      const doc = iframe.contentDocument;
      const meta = doc.querySelector('meta[name="viewport"]');
      if (!meta || !/viewport-fit=cover/.test(meta.content || '')) {
        row.ok = false;
        row.notes.push('viewport-fit');
      }
      doc.querySelectorAll('input[type="number"], input[type="text"]').forEach((el) => {
        const fs = parseFloat(iframe.contentWindow.getComputedStyle(el).fontSize);
        if (fs < 15.5 && el.offsetParent !== null) {
          /* only flag if visible-ish; settings fields may be hidden */
          const r = el.getBoundingClientRect();
          if (r.width > 0 && r.height > 0 && fs < 15.5) {
            row.notes.push(el.id || el.className + ' ' + fs + 'px');
          }
        }
      });
    } catch (err) {
      row.ok = false;
      row.notes.push(String(err.message || err));
    }
    if (iframe) iframe.remove();
    results.push(row);
  }

  const failed = results.filter((r) => !r.ok);
  out.textContent = results.map((r) =>
    (r.ok ? 'OK  ' : 'FAIL') + ' ' + r.tool + (r.notes.length ? ' — ' + r.notes.join('; ') : '')
  ).join('\n') + '\n\n' + (failed.length ? failed.length + ' failed' : 'all passed');
})();
</script>
