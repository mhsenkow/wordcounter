<!doctype html>
<meta charset="utf-8">
<title>gesture smoke</title>
<pre id="out">running…</pre>
<script>
(async () => {
  const out = document.getElementById('out');
  const tools = [
    { path: 'bill', primary: 'tip', secondary: 'people' },
    { path: 'hourly', primary: 'days', secondary: 'hpd', pinchTarget: 'rate' },
    { path: 'fuel', primary: 'miles', secondary: 'mpg', pinchTarget: 'price' },
    { path: 'unit', primary: 'amount' },
    { path: 'dose', primary: 'want', secondary: 'vol', pinchTarget: 'have' },
    { path: 'bitrate', primary: 'size', secondary: 'speed' },
    { path: 'scalemap', primary: 'measure', secondary: 'real' },
    { path: 'ratio', primary: 'w' },
    { path: 'typescale', primary: 'base', secondary: 'steps' },
    { path: 'odds', primary: 'p', secondary: 'win' },
    { path: 'combo', primary: 'n', secondary: 'k' },
    { path: 'sample', primary: 'n', secondary: 'p' },
    { path: 'budget', primary: 'live', secondary: 'pot' },
    { path: 'exposure', primary: 'fnum', secondary: 'shut', pinchTarget: 'iso' },
    { path: 'deal', primary: 'left', secondary: 'want' },
    { path: 'streak', primary: 'p', secondary: 'run' },
    { path: 'tax', primary: 'subtotal', secondary: 'tip' },
    { path: 'pace', primary: 'pace', secondary: 'distance' },
    { path: 'contrast', primary: 'lift' },
    { path: 'bayes', primary: 'prior', secondary: 'hit' },
  ];
  const results = [];

  function loadFrame(src) {
    return new Promise((resolve, reject) => {
      const iframe = document.createElement('iframe');
      iframe.style.cssText = 'position:fixed;left:-9999px;width:900px;height:700px;border:0';
      iframe.src = src;
      const t = setTimeout(() => reject(new Error('timeout ' + src)), 8000);
      iframe.onload = () => {
        clearTimeout(t);
        setTimeout(() => resolve(iframe), 160);
      };
      document.body.appendChild(iframe);
    });
  }

  function fireWheel(target, opts) {
    const e = new WheelEvent('wheel', Object.assign({
      bubbles: true, cancelable: true, deltaMode: 0
    }, opts));
    target.dispatchEvent(e);
    return e.defaultPrevented;
  }

  for (const t of tools) {
    const row = { tool: t.path, ok: true, notes: [] };
    let iframe;
    try {
      try {
        localStorage.removeItem('ibm.tool.' + t.path + '.values');
        if (t.path === 'bill') localStorage.removeItem('ibm.tool.bill');
      } catch (err) {}
      iframe = await loadFrame('/' + t.path + '/?smoke=' + Date.now());
      const doc = iframe.contentDocument;
      if (doc.documentElement.getAttribute('data-gestures') !== '1') {
        row.ok = false; row.notes.push('data-gestures missing');
      }
      const primary = doc.getElementById(t.primary);
      if (!primary || !primary.hasAttribute('data-primary')) {
        row.ok = false; row.notes.push('primary attr');
      }
      /* Chrome form-restore can leave fields at max from prior runs — snap to defaults */
      function resetField(el) {
        if (!el) return;
        const attr = el.getAttribute('value');
        el.value = attr != null ? attr : (el.defaultValue || '1');
        el.dispatchEvent(new Event('input', { bubbles: true }));
      }
      resetField(primary);
      if (t.secondary) resetField(doc.getElementById(t.secondary));
      if (t.pinchTarget) resetField(doc.getElementById(t.pinchTarget));
      if (doc.activeElement && doc.activeElement.blur) doc.activeElement.blur();

      const before = primary.value;
      for (let i = 0; i < 3; i++) fireWheel(doc, { deltaY: -40, deltaX: 0 });
      if (Number(primary.value) <= Number(before)) {
        row.ok = false; row.notes.push('vertical no increase ' + before + '→' + primary.value);
      }

      if (t.secondary) {
        const sec = doc.getElementById(t.secondary);
        if (sec && sec.tagName !== 'SELECT') {
          const sb = sec.value;
          for (let i = 0; i < 3; i++) fireWheel(doc, { deltaY: 0, deltaX: 40 });
          if (primary.getAttribute('data-axis-x') === t.secondary && Number(sec.value) === Number(sb)) {
            row.ok = false; row.notes.push('horizontal no change');
          }
          sec.focus();
          const s2 = sec.value;
          const p2 = primary.value;
          for (let i = 0; i < 3; i++) fireWheel(doc, { deltaY: -40, deltaX: 0 });
          if (Number(sec.value) <= Number(s2)) {
            row.ok = false; row.notes.push('focused secondary not driven');
          }
          if (Number(primary.value) !== Number(p2)) {
            row.ok = false; row.notes.push('primary moved while secondary focused');
          }
          sec.blur();
        }
      }

      const pinchEl = doc.getElementById(t.pinchTarget || t.primary);
      if (doc.activeElement && doc.activeElement.blur) doc.activeElement.blur();
      const pb = pinchEl.value;
      for (let i = 0; i < 3; i++) fireWheel(doc, { deltaY: -40, deltaX: 0, ctrlKey: true });
      if (Number(pinchEl.value) === Number(pb)) {
        row.ok = false; row.notes.push('pinch no change');
      }

      doc.body.classList.add('settings-open');
      const freeze = primary.value;
      for (let i = 0; i < 3; i++) fireWheel(doc, { deltaY: -40, deltaX: 0 });
      if (primary.value !== freeze) {
        row.ok = false; row.notes.push('settings still adjusts');
      }
      doc.body.classList.remove('settings-open');

      if (t.path === 'ratio') {
        const stage = doc.getElementById('stage');
        const w = doc.getElementById('w');
        const h = doc.getElementById('h');
        const wb = w.value, hb = h.value;
        for (let i = 0; i < 3; i++) {
          stage.dispatchEvent(new WheelEvent('wheel', {
            bubbles: true, cancelable: true, deltaY: -40, ctrlKey: true, deltaMode: 0
          }));
        }
        if (Number(w.value) === Number(wb) && Number(h.value) === Number(hb)) {
          row.ok = false; row.notes.push('ratio pinch no scale');
        }
      }

      // Long stacks (typescale): mid-list scroll must not nudge values
      if (t.path === 'typescale') {
        const stack = doc.querySelector('main .stack');
        const max = stack ? stack.scrollHeight - stack.clientHeight : 0;
        if (stack && max > 40) {
          stack.scrollTop = Math.floor(max / 2);
          if (stack.scrollTop > 15 && stack.scrollTop < max - 15) {
            const midVal = primary.value;
            stack.dispatchEvent(new WheelEvent('wheel', {
              bubbles: true, cancelable: true, deltaY: 40, deltaX: 0, deltaMode: 0
            }));
            if (primary.value !== midVal) {
              row.ok = false; row.notes.push('mid-stack hijacked');
            }
          }
        }
      }
    } catch (e) {
      row.ok = false; row.notes.push(String(e && e.message || e));
    }
    if (iframe) iframe.remove();
    results.push(row);
  }

  /* —— Desk: words primary cycle (trackpad twin of swipe) —— */
  {
    const row = { tool: 'words', ok: true, notes: [] };
    let iframe;
    try {
      iframe = await loadFrame('/?smoke=' + Date.now());
      const doc = iframe.contentDocument;
      const block = doc.getElementById('primaryBlock');
      const label = doc.getElementById('primaryLabel');
      const draft = doc.getElementById('text') || doc.querySelector('textarea');
      if (!block || !label) {
        row.ok = false; row.notes.push('primaryBlock/label missing');
      } else {
        if (draft && draft.blur) draft.blur();
        if (doc.activeElement && doc.activeElement.blur) doc.activeElement.blur();
        const before = label.textContent.trim();
        for (let i = 0; i < 4; i++) fireWheel(block, { deltaY: 0, deltaX: 60 });
        await new Promise(r => setTimeout(r, 50));
        const after = label.textContent.trim();
        if (after === before) {
          row.ok = false; row.notes.push('horizontal wheel no cycle ' + before);
        }
        doc.body.classList.add('settings-open');
        const freeze = label.textContent.trim();
        for (let i = 0; i < 4; i++) fireWheel(block, { deltaY: 0, deltaX: 60 });
        if (label.textContent.trim() !== freeze) {
          row.ok = false; row.notes.push('settings still cycles primary');
        }
        doc.body.classList.remove('settings-open');
      }
    } catch (e) {
      row.ok = false; row.notes.push(String(e && e.message || e));
    }
    if (iframe) iframe.remove();
    results.push(row);
  }

  /* —— Desk: time dial / chart scrub + arrow keys —— */
  {
    const row = { tool: 'time', ok: true, notes: [] };
    let iframe;
    try {
      iframe = await loadFrame('/timecount/?smoke=' + Date.now());
      const doc = iframe.contentDocument;
      const dial = doc.getElementById('dial');
      const target = doc.getElementById('targetInput');
      const progress = doc.getElementById('progress');
      if (!dial || !target) {
        row.ok = false; row.notes.push('dial/target missing');
      } else {
        if (doc.activeElement && doc.activeElement.blur) doc.activeElement.blur();
        /* Ensure a soft limit exists so scrub is enabled */
        if (!target.value) {
          target.value = '25m';
          target.dispatchEvent(new Event('change', { bubbles: true }));
          await new Promise(r => setTimeout(r, 40));
        }
        const before = target.value;
        for (let i = 0; i < 3; i++) fireWheel(dial, { deltaY: -40, deltaX: 0 });
        await new Promise(r => setTimeout(r, 40));
        if (target.value === before) {
          row.ok = false; row.notes.push('dial wheel no change ' + before);
        }
        if (progress) {
          progress.hidden = false;
          const mid = target.value;
          for (let i = 0; i < 3; i++) fireWheel(progress, { deltaY: -40, deltaX: 0 });
          await new Promise(r => setTimeout(r, 40));
          if (target.value === mid) {
            row.ok = false; row.notes.push('chart wheel no change');
          }
        }
        const keyBefore = target.value;
        doc.dispatchEvent(new KeyboardEvent('keydown', {
          key: 'ArrowUp', bubbles: true, cancelable: true
        }));
        await new Promise(r => setTimeout(r, 40));
        if (target.value === keyBefore) {
          row.ok = false; row.notes.push('ArrowUp no nudge');
        }
        doc.body.classList.add('settings-open');
        const freeze = target.value;
        for (let i = 0; i < 3; i++) fireWheel(dial, { deltaY: -40, deltaX: 0 });
        if (target.value !== freeze) {
          row.ok = false; row.notes.push('settings still scrubs dial');
        }
        doc.body.classList.remove('settings-open');
      }
    } catch (e) {
      row.ok = false; row.notes.push(String(e && e.message || e));
    }
    if (iframe) iframe.remove();
    results.push(row);
  }

  /* —— Deep mode gesture subset —— */
  const deepTools = [
    { path: 'bill', scrub: 'tip' },
    { path: 'fuel', scrub: 'miles' },
    { path: 'ratio', scrub: 'w', isRatio: true },
    { path: 'budget', scrub: 'live' },
    { path: 'pace', scrub: 'pace' }
  ];
  for (const t of deepTools) {
    const row = { tool: t.path + ':deep', ok: true, notes: [] };
    let iframe;
    try {
      try {
        localStorage.setItem('ibm.tool.' + t.path + '.settings', JSON.stringify({
          theme: 'light', ui: 'braun', font: 'mono', faces: 'local', showViz: 'deep'
        }));
      } catch (e) {}
      iframe = await loadFrame('/' + t.path + '/?deepgest=' + Date.now());
      await new Promise(r => setTimeout(r, 2200));
      const doc = iframe.contentDocument;
      const stage = doc.getElementById('toolStage');
      if (!stage) { row.ok = false; row.notes.push('toolStage missing'); }
      else if (stage.querySelector('.deep-fallback')) {
        row.ok = false; row.notes.push('deep-fallback');
      } else {
        const input = doc.getElementById(t.scrub);
        const scrubEl = stage.querySelector('.deep-scrub[data-scrub="' + t.scrub + '"]') || stage;
        if (!input) { row.ok = false; row.notes.push('input ' + t.scrub); }
        else {
          const before = input.value;
          for (let i = 0; i < 3; i++) fireWheel(scrubEl, { deltaY: -40, deltaX: 0 });
          if (Number(input.value) <= Number(before)) {
            row.ok = false; row.notes.push('deep wheel no change ' + before + '→' + input.value);
          }
        }
        if (t.isRatio) {
          const rs = doc.querySelector('.ratio-stage');
          if (rs && rs.offsetParent !== null) {
            row.ok = false; row.notes.push('ratio-stage visible in deep');
          }
        }
      }
    } catch (e) {
      row.ok = false; row.notes.push(String(e && e.message || e));
    }
    if (iframe) iframe.remove();
    results.push(row);
  }

  const fail = results.filter(r => !r.ok).length;
  out.textContent = JSON.stringify({ fail, results }, null, 2);
  document.title = fail ? 'FAIL ' + fail : 'PASS';
})();
</script>
