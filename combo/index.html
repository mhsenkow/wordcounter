<!doctype html>
<html lang="en" data-theme="light" data-ui="braun" data-font="mono" data-faces="auto" data-show-viz="true">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f2f2f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161616" media="(prefers-color-scheme: dark)">
<title>combo — ibm.io</title>
<meta name="description" content="ways to pick">
<link rel="canonical" href="https://ibm.io/combo/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="webFonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Serif:wght@400;500&family=Josefin+Sans:wght@400;500&family=Josefin+Slab:wght@400;500&family=Libre+Franklin:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Oswald:wght@400;500&family=Roboto+Slab:wght@400;500&family=Share+Tech+Mono&family=Source+Code+Pro:wght@400;500&family=Source+Sans+3:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&family=Space+Mono:wght@400;700&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Serif:wght@400;500&family=Josefin+Sans:wght@400;500&family=Josefin+Slab:wght@400;500&family=Libre+Franklin:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Oswald:wght@400;500&family=Roboto+Slab:wght@400;500&family=Share+Tech+Mono&family=Source+Code+Pro:wght@400;500&family=Source+Sans+3:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&family=Space+Mono:wght@400;700&display=swap"></noscript>
<link rel="stylesheet" href="../lib/number-tool.css?v=39">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../icons/icon-192.png">
</head>
<body class="tool-app" data-tool="combo">
<header class="masthead">
  <div class="masthead-start">
    <h1>combo</h1>
  </div>
  <div class="actions">
    <button id="themeBtn" class="icon-btn" type="button" aria-label="theme">
      <span class="theme-orb" aria-hidden="true"></span>
    </button>
    <button id="settingsToggle" type="button" aria-expanded="false" aria-controls="settings">settings</button>
  </div>
</header>
<main>

  <div class="face">
    <div class="face-value" id="out" role="status" aria-live="polite" aria-atomic="true">0</div>
    <p class="face-sub" id="sub">distinct groups</p>
  </div>
  <div class="stack">
    <fieldset class="panel">
      <legend>pile</legend>
      <label class="row"><span class="key">from</span><span class="value"><input id="n" type="number" inputmode="numeric" min="0" step="1" value="52" data-primary data-axis="y" data-axis-x="k" data-step-fast="5" data-gesture="1" aria-label="total items in the pile"></span></label>
      <label class="row"><span class="key">pick</span><span class="value"><input id="k" type="number" inputmode="numeric" min="0" step="1" value="5" aria-label="how many to pick"></span></label>
    </fieldset>
    <div class="presets" id="presets" role="group" aria-label="combo presets">
      <button type="button" class="preset" data-n="52" data-k="5">poker</button>
      <button type="button" class="preset" data-n="49" data-k="6">lotto</button>
      <button type="button" class="preset" data-n="10" data-k="3">team</button>
      <button type="button" class="preset" data-n="20" data-k="2">pair</button>
    </div>
    <p class="note">same cards in a different order still count as one</p>
  </div>
</main>
<script src="../lib/suite.js?v=39"></script>
<script src="../lib/number-tool.js?v=39"></script>
<script>
(function () {
  if (window.IBMTools) IBMTools.mountSuiteNav('combo');
  var toolUI = window.IBMNumberTool && IBMNumberTool.mountSettings({
    id: 'combo',
    about: "How many distinct groups can you draw from a pile when order does not matter — a 5-card hand, a lottery ticket, a team of three.",
    hasViz: true,
    extra: {"defaults":{"shape":"ring"},"fieldsHtml":"<fieldset><legend>shape</legend><div class=\"seg\" role=\"radiogroup\" aria-label=\"combo shape\"><label><input type=\"radio\" name=\"shape\" value=\"ring\"><span>ring</span></label><label><input type=\"radio\" name=\"shape\" value=\"grid\"><span>grid</span></label></div></fieldset>"},
    onApply: function () {
      if (typeof window.__ibmToolRender === 'function') window.__ibmToolRender();
    }
  });

  var stage = IBMNumberTool.ensureStage('combo');
  function S(){ return (toolUI && toolUI.settings) || {}; }
  function choose(n, k){
    n = Math.floor(n); k = Math.floor(k);
    if (k < 0 || n < 0 || k > n) return 0;
    k = Math.min(k, n - k);
    var r = 1;
    for (var i = 1; i <= k; i++) r = r * (n - k + i) / i;
    return Math.round(r);
  }
  function paint(n, k){
    var shape = S().shape || 'ring';
    if (shape === 'grid' || (shape === 'auto' && n <= 16)) {
      var maxN = 64;
      var scale = n > maxN ? n / maxN : 1;
      var cells = Math.max(0, Math.min(maxN, Math.round(n / scale)));
      var on = Math.max(0, Math.min(cells, Math.round(k / scale)));
      stage.innerHTML = '<div class="stage-grid is-sq" id="comboGrid"></div>';
      IBMNumberTool.paintCells(document.getElementById('comboGrid'), {
        count: cells, on: on, shape: 'sq',
        cols: Math.ceil(Math.sqrt(cells)) || 1,
        rawCount: n
      });
      return;
    }
    var seats = Math.max(3, Math.min(48, n || 3));
    var lit = Math.max(0, Math.min(seats, k));
    var html = '<div class="combo-ring" style="--n:' + seats + '">';
    for (var i = 0; i < seats; i++) {
      var ang = (i / seats) * 360;
      html += '<i class="' + (i < lit ? 'on' : '') + '" data-scrub="' + (i < lit ? 'k' : 'n') + '" style="--a:' + ang.toFixed(2) + 'deg"></i>';
    }
    html += '</div>';
    stage.innerHTML = html;
    IBMNumberTool.afterPaint && IBMNumberTool.afterPaint();
  }
  function render(){
    var n = Math.max(0, parseInt(document.getElementById('n').value, 10) || 0);
    var k = Math.max(0, parseInt(document.getElementById('k').value, 10) || 0);
    var ways = choose(n, k);
    document.getElementById('out').textContent = IBMNumberTool.formatCount(ways);
    document.getElementById('sub').textContent =
      k > n ? 'cannot pick ' + k + ' from ' + n : 'ways to pick ' + k + ' from ' + n;
    var mode = IBMNumberTool.vizMode ? IBMNumberTool.vizMode(S()) : 'viz';
    if (mode === 'deep') IBMNumberTool.paintDeep('combo', stage, { n: n, k: k, count: ways });
    else if (mode !== 'plain') paint(n, k);
    else stage.innerHTML = '';
  }
  window.__ibmToolRender = render;
  document.getElementById('presets').addEventListener('click', function(e){
    var btn = e.target.closest('.preset');
    if (!btn) return;
    document.getElementById('n').value = btn.getAttribute('data-n');
    document.getElementById('k').value = btn.getAttribute('data-k');
    render();
  });
  ['n','k'].forEach(function(id){ document.getElementById(id).addEventListener('input', render); });
  render();
})();
</script>
</body>
</html>
