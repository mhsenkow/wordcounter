<!doctype html>
<html lang="en" data-theme="light" data-ui="braun" data-font="mono" data-faces="auto" data-show-viz="true">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f2f2f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161616" media="(prefers-color-scheme: dark)">
<title>budget — ibm.io</title>
<meta name="description" content="week envelopes">
<link rel="canonical" href="https://ibm.io/budget/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="webFonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Serif:wght@400;500&family=Josefin+Sans:wght@400;500&family=Josefin+Slab:wght@400;500&family=Libre+Franklin:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Oswald:wght@400;500&family=Roboto+Slab:wght@400;500&family=Share+Tech+Mono&family=Source+Code+Pro:wght@400;500&family=Source+Sans+3:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&family=Space+Mono:wght@400;700&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Serif:wght@400;500&family=Josefin+Sans:wght@400;500&family=Josefin+Slab:wght@400;500&family=Libre+Franklin:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Oswald:wght@400;500&family=Roboto+Slab:wght@400;500&family=Share+Tech+Mono&family=Source+Code+Pro:wght@400;500&family=Source+Sans+3:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&family=Space+Mono:wght@400;700&display=swap"></noscript>
<link rel="stylesheet" href="../lib/number-tool.css?v=45">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../icons/icon-192.png">
</head>
<body class="tool-app" data-tool="budget">
<header class="masthead">
  <div class="masthead-start">
    <h1>budget</h1>
  </div>
  <div class="actions">
    <button id="themeBtn" class="icon-btn" type="button" aria-label="theme">
      <span class="theme-orb" aria-hidden="true"></span>
    </button>
    <button id="settingsToggle" type="button" aria-expanded="false" aria-controls="settings">settings</button>
  </div>
</header>
<main>

  <div class="face">
    <div class="face-value" id="out" role="status" aria-live="polite" aria-atomic="true">$0</div>
    <p class="face-sub" id="sub">left this week</p>
  </div>
  <div class="stack">
    <fieldset class="panel">
      <legend>week</legend>
      <label class="row"><span class="key">pot</span><span class="value"><input id="pot" type="number" inputmode="decimal" min="0" step="10" value="600" data-step-fast="50" aria-label="weekly pot"></span></label>
    </fieldset>
    <fieldset class="panel">
      <legend>envelopes</legend>
      <label class="row"><span class="key">live</span><span class="value"><input id="live" type="number" inputmode="decimal" min="0" step="10" value="280" data-primary data-axis="y" data-step-fast="25" data-gesture="1" aria-label="live envelope"></span></label>
      <label class="row"><span class="key">food</span><span class="value"><input id="food" type="number" inputmode="decimal" min="0" step="5" value="120" data-step-fast="20" aria-label="food envelope"></span></label>
      <label class="row"><span class="key">move</span><span class="value"><input id="move" type="number" inputmode="decimal" min="0" step="5" value="80" data-step-fast="20" aria-label="move envelope"></span></label>
      <label class="row"><span class="key">fun</span><span class="value"><input id="fun" type="number" inputmode="decimal" min="0" step="5" value="60" data-step-fast="20" aria-label="fun envelope"></span></label>
    </fieldset>
    <div class="presets" id="presets" role="group" aria-label="week presets" data-cols="4">
      <button type="button" class="preset" data-pot="300" data-live="150" data-food="80" data-move="50" data-fun="20" aria-pressed="false">lean<span class="preset-meta">$300</span></button>
      <button type="button" class="preset" data-pot="600" data-live="280" data-food="120" data-move="80" data-fun="60" aria-pressed="true">base<span class="preset-meta">$600</span></button>
      <button type="button" class="preset" data-pot="800" data-live="200" data-food="200" data-move="250" data-fun="100" aria-pressed="false">travel<span class="preset-meta">$800</span></button>
      <button type="button" class="preset" data-pot="400" data-live="220" data-food="100" data-move="60" data-fun="40" aria-pressed="false">tight<span class="preset-meta">$400</span></button>
    </div>
  </div>
</main>
<script src="../lib/suite.js?v=45"></script>
<script src="../lib/number-tool.js?v=45"></script>
<script>
(function () {
  if (window.IBMTools) IBMTools.mountSuiteNav('budget');
  var toolUI = window.IBMNumberTool && IBMNumberTool.mountSettings({
    id: 'budget',
    about: "Split a weekly pot into envelopes. Pot well shows remaining; drawers or share chart below.",
    hasViz: true,
    extra: {"defaults":{"layout":"drawers","warn":"tint"},"fieldsHtml":"<fieldset><legend>layout</legend><div class=\"seg\" role=\"radiogroup\" aria-label=\"budget layout\"><label><input type=\"radio\" name=\"layout\" value=\"drawers\"><span>drawers</span></label><label><input type=\"radio\" name=\"layout\" value=\"share\"><span>share</span></label></div></fieldset><fieldset><legend>warn</legend><div class=\"seg\" role=\"radiogroup\" aria-label=\"over allocation\"><label><input type=\"radio\" name=\"warn\" value=\"tint\"><span>tint</span></label><label><input type=\"radio\" name=\"warn\" value=\"strike\"><span>strike</span></label></div></fieldset>"},
    onApply: function () {
      if (typeof window.__ibmToolRender === 'function') window.__ibmToolRender();
    }
  });

  var stage = IBMNumberTool.ensureStage('budget');
  var ENVS = [
    { id: 'live', label: 'live' },
    { id: 'food', label: 'food' },
    { id: 'move', label: 'move' },
    { id: 'fun', label: 'fun' }
  ];
  function S(){ return (toolUI && toolUI.settings) || {}; }
  function money(n){ return IBMNumberTool.formatMoney(n); }
  function paint(pot, parts, left){
    var layout = S().layout || 'drawers';
    var warn = S().warn || 'tint';
    var used = parts.reduce(function(s, p){ return s + p.amt; }, 0);
    var remPct = pot > 0 ? Math.max(0, Math.min(100, (Math.max(0, left) / pot) * 100)) : 0;
    var over = left < 0;
    var html = '<div class="budget-well" data-layout="' + layout + '" data-warn="' + warn + '" data-over="' + (over ? '1' : '0') + '">';
    html += '<div class="pot-bar" data-scrub="pot"><b style="width:' + remPct.toFixed(1) + '%"></b>';
    if (over) html += '<i class="over" style="width:' + Math.min(100, (Math.abs(left) / Math.max(pot, 1)) * 100).toFixed(1) + '%"></i>';
    html += '</div>';
    if (layout === 'share') {
      html += '<div class="share-stack">';
      var denom = Math.max(used, pot, 1);
      for (var i = 0; i < parts.length; i++) {
        var p = parts[i];
        var w = Math.max(0, (p.amt / denom) * 100);
        html += '<div class="share-seg" data-scrub="' + p.id + '" style="width:' + w.toFixed(1) + '%"><em>' + p.label + '</em></div>';
      }
      html += '</div>';
    } else {
      html += '<div class="env-cols">';
      for (var j = 0; j < parts.length; j++) {
        var e = parts[j];
        var pct = pot > 0 ? Math.max(0, Math.min(100, (e.amt / pot) * 100)) : 0;
        html += '<div class="env" data-scrub="' + e.id + '" style="--fill:' + pct.toFixed(1) + '%"><em>' + e.label + '</em><i></i></div>';
      }
      html += '</div>';
    }
    html += '</div>';
    stage.innerHTML = html;
    IBMNumberTool.afterPaint && IBMNumberTool.afterPaint();
  }
  function render(){
    var pot = Math.max(0, parseFloat(document.getElementById('pot').value) || 0);
    var parts = ENVS.map(function(e){
      return { id: e.id, label: e.label, amt: Math.max(0, parseFloat(document.getElementById(e.id).value) || 0) };
    });
    var used = parts.reduce(function(s, p){ return s + p.amt; }, 0);
    var left = pot - used;
    document.getElementById('out').textContent = money(left);
    document.getElementById('out').style.color = left < 0 ? 'var(--mark, var(--accent))' : '';
    document.getElementById('sub').textContent =
      left < 0
        ? 'over by ' + money(Math.abs(left)) + ' · used ' + money(used)
        : money(used) + ' allocated · ' + (pot ? Math.round((used / pot) * 100) : 0) + '%';
    var mode = IBMNumberTool.vizMode ? IBMNumberTool.vizMode(S()) : 'viz';
    if (mode === 'deep') {
      IBMNumberTool.paintDeep('budget', stage, {
        pot: pot, live: parts[0].amt, food: parts[1].amt, move: parts[2].amt, fun: parts[3].amt
      });
    } else if (mode !== 'plain') paint(pot, parts, left);
    else stage.innerHTML = '';
    if (presets) presets.sync();
  }
  window.__ibmToolRender = render;
  ['pot','live','food','move','fun'].forEach(function(id){
    document.getElementById(id).addEventListener('input', render);
  });

  var presets = IBMNumberTool.bindPresets('#presets', {
    keys: ["pot","live","food","move","fun"],
    map: null,
    after: function () { render(); }
  });
  render();
})();
</script>
</body>
</html>
