<!doctype html>
<html lang="en" data-theme="light" data-ui="braun" data-font="mono" data-faces="auto" data-show-viz="true">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f2f2f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161616" media="(prefers-color-scheme: dark)">
<title>tax — ibm.io</title>
<meta name="description" content="tip · tax">
<link rel="canonical" href="https://ibm.io/tax/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="webFonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Serif:wght@400;500&family=Josefin+Sans:wght@400;500&family=Josefin+Slab:wght@400;500&family=Libre+Franklin:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Oswald:wght@400;500&family=Roboto+Slab:wght@400;500&family=Share+Tech+Mono&family=Source+Code+Pro:wght@400;500&family=Source+Sans+3:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&family=Space+Mono:wght@400;700&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Serif:wght@400;500&family=Josefin+Sans:wght@400;500&family=Josefin+Slab:wght@400;500&family=Libre+Franklin:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Oswald:wght@400;500&family=Roboto+Slab:wght@400;500&family=Share+Tech+Mono&family=Source+Code+Pro:wght@400;500&family=Source+Sans+3:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&family=Space+Mono:wght@400;700&display=swap"></noscript>
<link rel="stylesheet" href="../lib/number-tool.css?v=39">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../icons/icon-192.png">
</head>
<body class="tool-app" data-tool="tax">
<header class="masthead">
  <div class="masthead-start">
    <h1>tax</h1>
  </div>
  <div class="actions">
    <button id="themeBtn" class="icon-btn" type="button" aria-label="theme">
      <span class="theme-orb" aria-hidden="true"></span>
    </button>
    <button id="settingsToggle" type="button" aria-expanded="false" aria-controls="settings">settings</button>
  </div>
</header>
<main>

  <div class="face">
    <div class="face-value" id="out" role="status" aria-live="polite" aria-atomic="true">$0.00</div>
    <p class="face-sub" id="sub">grand</p>
  </div>
  <div class="stack">
    <fieldset class="panel">
      <legend>check</legend>
      <label class="row"><span class="key">subtotal</span><span class="value"><input id="subtotal" type="number" inputmode="decimal" min="0" step="0.01" value="72.00" data-primary data-axis="y" data-axis-x="tip" data-step-fast="5" data-gesture="1" aria-label="subtotal"></span></label>
      <label class="row"><span class="key">tax</span><span class="value"><input id="tax" type="number" inputmode="decimal" min="0" max="100" step="0.25" value="8.875" aria-label="tax percent"><span class="unit">%</span></span></label>
      <label class="row"><span class="key">tip</span><span class="value"><select id="tip" aria-label="tip percent"><option value="15">15%</option><option value="18">18%</option><option value="20" selected>20%</option><option value="22">22%</option><option value="25">25%</option></select></span></label>
      <label class="row"><span class="key">tip on</span><span class="value"><select id="tipOn" aria-label="tip base"><option value="pre" selected>pre-tax</option><option value="total">after tax</option></select></span></label>
    </fieldset>
  </div>
</main>
<script src="../lib/suite.js?v=39"></script>
<script src="../lib/number-tool.js?v=39"></script>
<script>
(function () {
  if (window.IBMTools) IBMTools.mountSuiteNav('tax');
  var toolUI = window.IBMNumberTool && IBMNumberTool.mountSettings({
    id: 'tax',
    about: "Subtotal → tax → tip. Tip can sit on pre-tax or on the taxed total. Stage is a stacked receipt; scrub each band.",
    hasViz: true,
    extra: null,
    onApply: function () {
      if (typeof window.__ibmToolRender === 'function') window.__ibmToolRender();
    }
  });

  var stage = IBMNumberTool.ensureStage('tax');
  var money = function(n){ return IBMNumberTool.formatMoney(n); };
  function tipOn(){
    var el = document.getElementById('tipOn');
    return (el && el.value === 'total') ? 'total' : 'pre';
  }
  function paint(sub, taxAmt, tipAmt, grand, tipBase){
    if (!stage) return;
    var taxShare = grand > 0 ? (taxAmt / grand) * 100 : 0;
    var tipShare = grand > 0 ? (tipAmt / grand) * 100 : 0;
    var subShare = Math.max(4, 100 - taxShare - tipShare);
    var onTotal = tipOn() === 'total';
    stage.innerHTML =
      '<div class="tax-receipt' + (onTotal ? ' is-on-total' : ' is-on-pre') + '">' +
        '<div class="tax-band is-sub" data-scrub="subtotal" style="--h:' + subShare + '%"><span>sub</span><b>' + money(sub) + '</b></div>' +
        '<div class="tax-band is-tax" data-scrub="tax" style="--h:' + Math.max(6, taxShare) + '%"><span>tax</span><b>' + money(taxAmt) + '</b></div>' +
        '<div class="tax-tip-mark" aria-hidden="true"><i></i><span>tip on ' + (onTotal ? 'total' : 'pre-tax') + ' · ' + money(tipBase) + '</span></div>' +
        '<div class="tax-band is-tip" data-scrub="tip" style="--h:' + Math.max(6, tipShare) + '%"><span>tip</span><b>' + money(tipAmt) + '</b></div>' +
      '</div>';
    IBMNumberTool.afterPaint && IBMNumberTool.afterPaint();
  }
  function render(){
    var sub = Math.max(0, parseFloat(document.getElementById('subtotal').value) || 0);
    var taxPct = Math.max(0, parseFloat(document.getElementById('tax').value) || 0);
    var tipPct = Math.max(0, parseFloat(document.getElementById('tip').value) || 0);
    var taxAmt = sub * (taxPct / 100);
    var tipBase = tipOn() === 'total' ? sub + taxAmt : sub;
    var tipAmt = tipBase * (tipPct / 100);
    var grand = sub + taxAmt + tipAmt;
    document.getElementById('out').textContent = money(grand);
    document.getElementById('sub').textContent =
      'tax ' + money(taxAmt) + ' · tip ' + money(tipAmt) + ' on ' + (tipOn() === 'total' ? 'total' : 'pre-tax');
    var mode = IBMNumberTool.vizMode ? IBMNumberTool.vizMode(toolUI && toolUI.settings || {}) : 'viz';
    if (mode === 'deep') IBMNumberTool.paintDeep('tax', stage, { sub: sub, taxPct: taxPct, tipPct: tipPct, tipOn: tipOn() });
    else if (mode !== 'plain') paint(sub, taxAmt, tipAmt, grand, tipBase);
    else stage.innerHTML = '';
  }
  window.__ibmToolRender = render;
  ['subtotal','tax','tip','tipOn'].forEach(function(id){
    document.getElementById(id).addEventListener('input', render);
    document.getElementById(id).addEventListener('change', render);
  });
  render();
})();
</script>
</body>
</html>
